aid: chefs-for-seniors
name: Chefs for Seniors
description: >-
  Chefs for Seniors is an in-home personal chef service for older adults, founded
  in 2013 by Barrett and Nathan Allman. Locally-owned franchise chefs come to a
  senior's home to plan menus, grocery shop, and cook 10-15 servings of fresh,
  customized meals each visit for about the cost of meal delivery. Menus rotate
  across 175+ options and accommodate diabetic, low-sodium, kidney-friendly,
  vegetarian, and other dietary needs, reviewed by a Registered Dietitian. The
  company operates across roughly 99 US locations, serves about 15,000 clients,
  and has prepared over 2.5 million meals. It was surfaced in the API Evangelist
  network as a portfolio company of 500 Global. Chefs for Seniors publishes no
  public developer API, SDKs, or machine-readable specifications; this profile
  captures its public web and domain-security posture.
